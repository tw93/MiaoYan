name: CI

on:
  push:
    branches: [main]
    # Without the tags trigger no run is ever created for tag pushes, so the
    # version-consistency job (gated on refs/tags/V*) was dead code and the
    # V3.5.1-class drift guard never actually ran.
    tags: ["V*"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repo: build, lint and render release notes only.
permissions:
  contents: read

jobs:
  build-mac:
    name: macOS build
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve SPM dependencies
        run: |
          xcodebuild \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -resolvePackageDependencies

      - name: Build macOS app (Debug)
        run: |
          set -o pipefail
          xcodebuild \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build | xcbeautify --renderer github-actions || \
          xcodebuild \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions || \
          xcodebuild test \
            -project MiaoYan.xcodeproj \
            -scheme MiaoYan \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Run MiaoYanCore package tests
        run: swift test --package-path Packages/MiaoYanCore

  lint:
    name: Lint
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Install swift-format
        run: brew install swift-format

      # Project `.swift-format` disables the rules the codebase deliberately
      # violates (PascalCase enum cases, retroactive NSTextStorageDelegate,
      # block comments, forEach). Remaining warnings are real and gate CI.
      - name: Run swift-format
        run: swift-format lint --recursive . --strict

  release-notes-smoke:
    name: Release notes smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Render appcast description HTML
        run: bash scripts/release-ci/notes_to_html.sh .github/RELEASE_NOTES.md > /tmp/description.html

      - name: Render GitHub release body
        run: bash scripts/release-ci/render_release_body.sh .github/RELEASE_NOTES.md > /tmp/release-body.html

      - name: Sanity check rendered outputs
        run: |
          test -s /tmp/description.html
          test -s /tmp/release-body.html

      # The two lists map one to one; a missing translation used to pass
      # because only non-empty output was checked.
      - name: Chinese and English lists have the same number of items
        run: |
          awk '/^---$/ { part = 2; next } /^[0-9]+\. / { if (part == 2) en++; else zh++ } END { printf "zh=%d en=%d\n", zh, en; exit (zh == en && zh > 0) ? 0 : 1 }' .github/RELEASE_NOTES.md

      - name: Check shell scripts
        run: |
          for f in scripts/*.sh scripts/release-ci/*.sh scripts/miaoyan; do bash -n "$f"; done
          shellcheck -S error scripts/*.sh scripts/release-ci/*.sh scripts/miaoyan

  # docs/incidents.md is the eval set for review: every row must name commits
  # that resolve, a known layer and a catcher defined in the code. Full
  # history so the commits are resolved, not only shape-checked.
  review-gates:
    name: Review gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the incident ledger
        run: python3 scripts/check_incidents.py

      - name: Test the ledger checker and risk tiers
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  version-consistency:
    name: Version consistency
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: startsWith(github.ref, 'refs/tags/V')
    steps:
      - uses: actions/checkout@v4

      - name: Verify MARKETING_VERSION == CURRENT_PROJECT_VERSION == tag
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          STRIPPED="${TAG#V}"
          # Every target/config must match the tag, not just the first
          # occurrence: the V3.5.1 / #524 drift was a single target out of
          # sync. Collect the distinct values and assert each equals the tag.
          MARKETING=$(grep 'MARKETING_VERSION = ' MiaoYan.xcodeproj/project.pbxproj | sed -E 's/.*MARKETING_VERSION = ([^;]+);.*/\1/' | tr -d ' ' | sort -u)
          PROJECT=$(grep 'CURRENT_PROJECT_VERSION = ' MiaoYan.xcodeproj/project.pbxproj | sed -E 's/.*CURRENT_PROJECT_VERSION = ([^;]+);.*/\1/' | tr -d ' ' | sort -u)
          echo "tag=${STRIPPED}"
          printf 'MARKETING_VERSION values:\n%s\n' "${MARKETING}"
          printf 'CURRENT_PROJECT_VERSION values:\n%s\n' "${PROJECT}"
          fail=0
          while IFS= read -r v; do
            [ -n "${v}" ] || continue
            if [ "${v}" != "${STRIPPED}" ]; then
              echo "::error::MARKETING_VERSION ${v} != tag ${STRIPPED}. See AGENTS.md V3.5.1 / #524."
              fail=1
            fi
          done <<< "${MARKETING}"
          while IFS= read -r v; do
            [ -n "${v}" ] || continue
            if [ "${v}" != "${STRIPPED}" ]; then
              echo "::error::CURRENT_PROJECT_VERSION ${v} != tag ${STRIPPED}. See AGENTS.md V3.5.1 / #524."
              fail=1
            fi
          done <<< "${PROJECT}"
          [ "${fail}" -eq 0 ]
