  <style>
    /* Critical styles to prevent flash */
    :root {
      --bg-color: #FDFCF9;
      --text-color: #262626;
      --code-bg: #F5F4ED;
      --diagram-bg: #F5F4ED;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #1E1D1B;
        --text-color: #E7E9EA;
        --code-bg: #282724;
        --diagram-bg: #282724;
      }
    }

    .darkmode {
      --bg-color: #1E1D1B;
      --text-color: #E7E9EA;
      --code-bg: #282724;
      --diagram-bg: #282724;
    }

    html,
    body {
      background: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 0;
    }

    img {
      image-rendering: auto;
      color-scheme: only light;
      image-orientation: from-image;
      max-width: 100%;
      height: auto;
    }
  </style>

<body>
  <script>
    if ('CUSTOM_CSS' === 'darkmode') {
      document.body.classList.add('darkmode');
    }
  </script>

  <div class="toc-hover-trigger"></div>
  <nav class="toc-nav">
    <div class="toc-content"></div>

      <svg class="pin-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"

  <div class="markdown-body heti" id="write">DOWN_HTML</div>
  <script>
    if ('CUSTOM_CSS' === 'darkmode') {
      document.getElementById('write').classList.add('darkmode');
    }
  </script>

  <script>
    // Deferred scripts (common.js, theme-config.js) execute before DOMContentLoaded,
    // so wrapping here ensures MiaoYanCommon and ThemeConfig are defined before use.
    document.addEventListener('DOMContentLoaded', function () {
      MiaoYanCommon.initializeCore();
      MiaoYanCommon.setupTextSelection();

      if ('CUSTOM_CSS' === 'darkmode') {
        ThemeConfig.applyDarkModeStyles();
      }

      MiaoYanCommon.onDOMReady(function () {
        // Initialize lazy loading and layout immediately
        MiaoYanCommon.setupHeaderAnchors();
        MiaoYanCommon.optimizeImages();
        MiaoYanCommon.setupImageZoom();
        MiaoYanCommon.setupScrollCorners();

        if (window.DiagramHandler) {
          DiagramHandler.initializeAll();
        }

        // Defer KaTeX rendering so it doesn't block image loading
        const renderMath = () => {
          renderMathInElement(document.body, {
            delimiters: [
              { left: "$$", right: "$$", display: true },
              { left: "$", right: "$", display: false },
              { left: "\\(", right: "\\)", display: false },
              { left: "\\[", right: "\\]", display: true }
            ],
            processEscapes: true,
            ignoredClasses: ['katex-display', 'katex', 'skip-math-dollar']
          });
        };
        if ('requestIdleCallback' in window) {
          requestIdleCallback(renderMath, { timeout: 200 });
        } else {
          setTimeout(renderMath, 0);
        }
      });
    });
  </script>
</body>
